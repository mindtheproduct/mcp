# Publishes server.json to the official MCP registry when a release is cut.
# Requires MCP_PUBLISHER_PRIVATE_KEY (Ed25519) in repo secrets, and the matching
# public key served at https://www.mindtheproduct.com/.well-known/mcp-registry-auth.
name: Publish to MCP registry

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install publisher
        run: |
          curl -sSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin mcp-publisher

      # HTTP verification, not DNS: the public key is served from
      # https://www.mindtheproduct.com/.well-known/mcp-registry-auth, so
      # publishing does not depend on a DNS change.
      - name: Login via HTTP-verified domain
        run: mcp-publisher login http --domain mindtheproduct.com --private-key "$PRIVATE_KEY"
        env:
          PRIVATE_KEY: ${{ secrets.MCP_PUBLISHER_PRIVATE_KEY }}

      - name: Validate manifest
        run: mcp-publisher validate

      - name: Publish
        run: mcp-publisher publish
